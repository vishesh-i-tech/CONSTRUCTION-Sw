name: SiteSaathi CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Run Test Suite (52+ Unit & Integration Tests)
        run: npm run test

      - name: Build TypeScript & Production Bundle (PWA + Capacitor)
        run: npm run build
